[package]
name = "app"
version = "1.0.0"
description = "HyperStream video and music downloader"
authors = ["HyperStream Team"]
license = "MIT"
repository = ""
edition = "2021"
rust-version = "1.77.2"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "HyperStream"
path = "src/main.rs"


[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2.11.3", features = ["unstable", "protocol-asset"] }
tauri-plugin-log = "2"
tauri-plugin-single-instance = "2.4"
window-vibrancy = "0.5"
windows-sys = { version = "0.59", features = ["Win32_System_JobObjects", "Win32_System_Threading", "Win32_Foundation", "Win32_Security", "Win32_UI_WindowsAndMessaging", "Win32_Graphics_Dwm", "Win32_Graphics_Gdi", "Win32_Storage_FileSystem", "Win32_System_ProcessStatus", "Win32_UI_Shell"] }
tokio = { version = "1.40", features = ["full"] }
reqwest = { version = "0.13", features = ["json", "stream"] }
aes = { version = "0.8", optional = true }
ctr = { version = "0.9", optional = true }
cipher = { version = "0.4", optional = true }
hex = { version = "0.4", optional = true }
quick-xml = "0.42"
regex = "1.13"
base64 = "0.22"
sha2 = "0.10"
flate2 = "1"
# Direct access to WebView2 for the built-in browser (history, extensions, context menu, ad blocking).
webview2-com = "0.38"
windows = { version = "0.61", features = ["Win32_System_Com", "Win32_UI_Shell", "Win32_UI_Input_KeyboardAndMouse"] }

[features]
default = []
# Isolated, non-default subsystem. Off in all shipping builds.
# Enable ONLY for local reference builds: cargo build --features experimental-drm
experimental-drm = ["dep:aes", "dep:ctr", "dep:cipher", "dep:hex"]

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true

