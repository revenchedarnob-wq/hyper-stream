[package]
name = "app"
version = "1.0.0"
description = "HyperStream Live Media Engine"
authors = ["HyperStream Team"]
license = "MIT"
repository = ""
edition = "2021"
rust-version = "1.77.2"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "HyperStream"
path = "src/main.rs"


[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2.11.3", features = ["unstable"] }
tauri-plugin-log = "2"
tauri-plugin-single-instance = "2.4"
window-vibrancy = "0.5"
windows-sys = { version = "0.59", features = ["Win32_System_JobObjects", "Win32_System_Threading", "Win32_Foundation", "Win32_Security", "Win32_UI_WindowsAndMessaging", "Win32_Graphics_Dwm", "Win32_Graphics_Gdi", "Win32_Storage_FileSystem", "Win32_System_ProcessStatus"] }
tokio = { version = "1.40", features = ["full"] }
reqwest = { version = "0.13", features = ["json", "stream"] }
aes = "0.8"
ctr = "0.9"
cipher = "0.4"
hex = "0.4"
quick-xml = "0.42"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true

