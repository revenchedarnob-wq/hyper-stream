<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024" fill="none">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="512" y1="32" x2="512" y2="992" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#181b26"/>
      <stop offset="50%" stop-color="#0e1017"/>
      <stop offset="100%" stop-color="#07080c"/>
    </linearGradient>

    <!-- Border Hairline Gradient -->
    <linearGradient id="borderGrad" x1="120" y1="40" x2="904" y2="980" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.4"/>
      <stop offset="30%" stop-color="#818cf8" stop-opacity="0.2"/>
      <stop offset="70%" stop-color="#ffffff" stop-opacity="0.05"/>
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0.2"/>
    </linearGradient>

    <!-- Ambient Core Glow -->
    <radialGradient id="coreGlow" cx="512" cy="512" r="400" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0284c7" stop-opacity="0.35"/>
      <stop offset="45%" stop-color="#6366f1" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>

    <!-- Glyph Primary Gradient -->
    <linearGradient id="glyphGrad" x1="0" y1="0" x2="48" y2="46" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="45%" stop-color="#60a5fa"/>
      <stop offset="85%" stop-color="#818cf8"/>
      <stop offset="100%" stop-color="#a855f7"/>
    </linearGradient>

    <!-- Inner Core Highlight Gradient -->
    <linearGradient id="innerHighlight" x1="10" y1="0" x2="38" y2="40" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.8"/>
      <stop offset="50%" stop-color="#bae6fd" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#818cf8" stop-opacity="0"/>
    </linearGradient>

    <!-- Drop Shadow for Glyph Depth -->
    <filter id="glyphShadow" x="180" y="190" width="664" height="644" filterUnits="userSpaceOnUse" color-interpolation-filters="sRGB">
      <feDropShadow dx="0" dy="16" stdDeviation="24" flood-color="#0284c7" flood-opacity="0.3"/>
      <feDropShadow dx="0" dy="32" stdDeviation="48" flood-color="#000000" flood-opacity="0.7"/>
    </filter>
  </defs>

  <!-- Squircle Base Tile (Windows 11 Fluent 2 / Linear / Raycast standard) -->
  <rect x="32" y="32" width="960" height="960" rx="224" fill="url(#bgGrad)"/>
  <rect x="32" y="32" width="960" height="960" rx="224" stroke="url(#borderGrad)" stroke-width="4"/>

  <!-- Inner Ambient Radiance -->
  <circle cx="512" cy="512" r="380" fill="url(#coreGlow)"/>

  <!-- HyperStream Glyph (Scaled 12x: 48x12=576, 46x12=552, centered at x=224, y=236) -->
  <g filter="url(#glyphShadow)">
    <g transform="translate(224, 236) scale(12)">
      <!-- Main Prism Body -->
      <path
        fill="url(#glyphGrad)"
        d="M25.946 44.938c-.664.845-2.021.375-2.021-.698V33.937a2.26 2.26 0 0 0-2.262-2.262H10.287c-.92 0-1.456-1.04-.92-1.788l7.48-10.471c1.07-1.497 0-3.578-1.842-3.578H1.237c-.92 0-1.456-1.04-.92-1.788L10.013.474c.214-.297.556-.474.92-.474h28.894c.92 0 1.456 1.04.92 1.788l-7.48 10.471c-1.07 1.498 0 3.579 1.842 3.579h11.377c.943 0 1.473 1.088.89 1.83L25.947 44.94z"
      />
      <!-- Top Bevel Sheen -->
      <path
        stroke="url(#innerHighlight)"
        stroke-width="0.75"
        stroke-linecap="round"
        stroke-linejoin="round"
        fill="none"
        d="M10.013.474h28.894c.92 0 1.456 1.04.92 1.788l-7.48 10.471c-1.07 1.498 0 3.579 1.842 3.579h11.377"
      />
    </g>
  </g>
</svg>
